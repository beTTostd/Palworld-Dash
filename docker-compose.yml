services:
  palworld-dash:
    build:
      context: .
    container_name: palworld-dash
    restart: unless-stopped
    # Match the owner of PalWorldSettings.ini while remaining non-root.
    user: "999:987"
    ports:
      - "3000:3000"
    environment:
      PALWORLD_API_URL: http://host.docker.internal:8212
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/palworld/server/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini:/palworld/PalWorldSettings.ini:ro
      - ./data:/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=32m,uid=999,gid=987
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  palworld-collector:
    image: python:3.13-alpine
    profiles:
      - collector
    working_dir: /app
    user: "999:987"
    environment:
      PALWORLD_API_URL: http://host.docker.internal:8212
      PALWORLD_CONFIG_PATH: /palworld/PalWorldSettings.ini
      PALWORLD_DATABASE_PATH: /data/palworld.db
      COLLECTION_INTERVAL_SECONDS: "300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/palworld/server/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini:/palworld/PalWorldSettings.ini:ro
      - ./collector:/app:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,uid=999,gid=987
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - /app/collect.py
