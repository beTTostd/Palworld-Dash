services:
  palworld-dash:
    build:
      context: .
    container_name: palworld-dash
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PALWORLD_API_URL: http://host.docker.internal:8212
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/palworld/server/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini:/palworld/PalWorldSettings.ini:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=32m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
